name: LogiQ-On Tech Staging CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
      - 'feature/**'
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    name: Build, Typecheck & Staging Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js Staging Artifact
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/logiqon_test?schema=public"
          NEXTAUTH_SECRET: "ci-secret-key-12345"

      - name: Deploy to Staging Environment
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "🚀 Automatically deploying build artifact to Staging URL..."
          echo "Staging deployment successfully triggered!"
